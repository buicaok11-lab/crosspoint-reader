name: Build Viet firmware

# Chay tu dong moi khi ban push len nhanh "viet", hoac bam tay trong tab Actions.
on:
  push:
    branches: [viet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core (pioarduino)
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build
        run: pio run -e gh_release -j1

      - name: Chay test lich am va thong ke
        run: |
          g++ -std=c++20 -Wall -Wextra -I lib test/viet_culture/*.cpp lib/VietCulture/*.cpp -o viet_test
          ./viet_test

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-viet-firmware
          path: .pio/build/gh_release/firmware.bin
